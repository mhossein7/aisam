[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aisam"
version = "0.1.0"
description = "A package for identifying dynamic systems with local LLM tools"
authors = [{ name = "Hossein Moghimian" }]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "dill",
    "gillespy2",
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "tqdm",
]

[project.optional-dependencies]
torch = ["torch"]

[project.scripts]
aisam = "aisam.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
